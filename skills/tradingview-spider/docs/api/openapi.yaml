      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolsListItem'

  /api/v1/symbols_list/custom/:
    get:
      operationId: getCustomSymbolsLists
      summary: 全部自定义自选股列表（含未激活的）
      tags: [用户态]
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
            example: web
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
