          schema:
            type: integer
          example: 209364636
        - name: source
          in: query
          required: true
          schema:
            type: string
            example: web
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolsListItem'

  /api/v1/symbols_list/colored/:
    get:
      operationId: getColoredSymbolsLists
      summary: 按颜色分组的自选股（红/橙/绿等预置分组）
      tags: [用户态]
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
            example: web
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SymbolsListItem'

  /api/v1/offers/:
    get:
      operationId: getOffers
      summary: 当前账号的付费试用/优惠状态
      tags: [用户态]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffersResponse'

  /check_language/:
    post:
      operationId: checkLanguage
      summary: 按 IP 判定的地区/语言偏好
      tags: [用户态]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckLanguageResponse'

  /chats/get/:
    get:
      operationId: getChats
      summary: 私信/社区聊天列表
      tags: [用户态]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          example: 30
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: {}

  /textnotes/getall/:
    get:
      operationId: getTextNotes
      summary: 图表文字笔记列表
      tags: [用户态]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: {}

  # ═══════════════════════════════════════════════════════════════
  #  用户态：价格提醒（pricealerts.tradingview.com）
  # ═══════════════════════════════════════════════════════════════
  /list_alerts:
    get:
      operationId: listAlerts
      summary: 已设置的价格提醒列表
      description: servers 需切换为 https://pricealerts.tradingview.com
      tags: [价格提醒]
      parameters:
        - name: log_username
          in: query
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
        - name: maintenance_unset_reason
          in: query
          required: false
          schema:
            type: string
            example: initial_operated
        - name: build_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsBaseResponse'

  /get_offline_fires:
    post:
      operationId: getOfflineFires
      summary: 离线期间触发过的提醒
      description: servers 需切换为 https://pricealerts.tradingview.com
      tags: [价格提醒]
      parameters:
        - name: log_username
          in: query
          required: true
          schema:
            type: string
        - name: maintenance_unset_reason
          in: query
          required: false
          schema:
            type: string
        - name: build_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsBaseResponse'

  /get_offline_fire_controls:
    post:
      operationId: getOfflineFireControls
      summary: 离线提醒的控制状态
      description: servers 需切换为 https://pricealerts.tradingview.com
      tags: [价格提醒]
      parameters:
        - name: log_username
          in: query
          required: true
          schema:
            type: string
        - name: maintenance_unset_reason
          in: query
          required: false
          schema:
            type: string
        - name: build_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsBaseResponse'

  # ═══════════════════════════════════════════════════════════════
  #  技术指标（Study/Indicator）：pine-facade.tradingview.com
  #  完整两段式实现（REST 编译 + WS 挂载）见分析文档 §7
  # ═══════════════════════════════════════════════════════════════
  /pine-facade/list:
    get:
      operationId: pineList
      summary: 枚举某一类技术指标/研究脚本目录
      description: |
        无需登录态即可访问（抓包实测无 Cookie 依赖）。四个 filter 各自独立：
        standard（常规技术指标库，实测 145 条，142 条免费）、
        candlestick（K 线形态识别，实测 45 条，全部免费）、
        fundamental（基本面科目当作 study 暴露，实测 1442 条，全部付费）、
        saved（当前登录账号自建的脚本，本次样本为空数组）。
        条目里的 scriptIdPart + version 是后续 versions/is_auth_to_get/translate
        三个端点的路径参数来源，不要自行拼造。
      tags: [技术指标]
      parameters:
        - name: filter
          in: query
          required: true
          schema:
            type: string
            enum: [standard, candlestick, fundamental, saved]
          example: standard
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PineListItem'

  /pine-facade/versions/{scriptIdPart}/{version}:
    get:
      operationId: pineVersions
      summary: 查询某指标的可用版本列表
      description: |
        version 路径段传字面量 "last" 表示最新版本。通常无需单独调用——
        list 返回的条目已带 version 字段，直接使用即可。
      tags: [技术指标]
      parameters:
        - name: scriptIdPart
          in: path
          required: true
          description: |
            指标唯一标识，需 URL 编码（空格→%1，%→%25，分号 ; 需编码为 %3B）。
            取自 pine-facade/list 响应的 scriptIdPart 字段，禁止自行拼造。
          schema:
            type: string
          example: "STD%3BAroon_Oscillator"
        - name: version
          in: path
          required: true
          schema:
            type: string
          example: last
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PineVersionEntry'

  /pine-facade/is_auth_to_get/{scriptIdPart}/{version}:
    get:
      operationId: pineIsAuthToGet
      summary: 查询当前会话是否有权限获取该指标
      description: |
        本次抓包 8 个免费指标样本均返回 true。确切语义（是否真按权限位判断，
        还是恒定返回 true 的占位检查）未经验证，见分析文档 §8.5，
        不要假设付费指标会在这里返回 false 而拦截 translate 调用。
      tags: [技术指标]
      parameters:
        - name: scriptIdPart
          in: path
          required: true
          schema:
            type: string
          example: "STD%3BAroon_Oscillator"
        - name: version
          in: path
          required: true
          schema:
            type: string
          example: "1.0"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PineIsAuthToGetResponse'

  /pine-facade/translate/{scriptIdPart}/{version}:
    get:
      operationId: pineTranslate
      summary: 编译指标脚本，产出可直接喂给 WS create_study 的密文
      description: |
        ★ 技术指标链路的核心端点。免费指标（scriptAccess=open_no_auth）实测全部
        正常返回 result.metaInfo + result.ilTemplate；`result.ilTemplate` 需要
        原样透传给 WS `create_study` 消息的 `inputs.text` 字段（已逐字节验证一致）。

        **付费指标（scriptAccess=closed_no_auth）的真实响应未经验证**：本次抓包
        唯一一条样本因抓包工具捕获缺失导致 response.text 呈现为 null（但
        response.content.size=21608 说明服务端确实返回了实质内容），不能据此
        判定"付费指标会编译失败"，需要用付费账号重新抓包确认，见分析文档 §8.5。
      tags: [技术指标]
      parameters:
        - name: scriptIdPart
          in: path
          required: true
          description: URL 编码后的指标标识，取自 pine-facade/list 的 scriptIdPart 字段
          schema:
            type: string
          example: "STD%3BAroon_Oscillator"
        - name: version
          in: path
          required: true
          description: 版本号，取自 list 条目的 version 字段（也可传字面量 last）
          schema:
            type: string
          example: "1.0"
      responses:
        '200':
          description: |
            HTTP 200（免费指标已验证正常返回内容；付费指标下是否仍为 200
            但 success=false/result=null，或是否走 4xx，未经验证）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PineTranslateResponse'

  # ═══════════════════════════════════════════════════════════════
  #  社区指标/策略脚本库：cn.tradingview.com/pubscripts-*
  #  发现阶段已验证，translate/create_study 全链路未验证，见分析文档 §8.2/§8.5
  # ═══════════════════════════════════════════════════════════════
  /pubscripts-library/:
    get:
      operationId: pubscriptsLibrary
      summary: 分页浏览社区发布的指标/策略脚本
      description: |
        与 pine-facade/list（官方指标目录）是完全独立的服务，scriptIdPart
        前缀为 PUB;（区别于官方的 STD;）。未见 Cookie 依赖，可无登录态访问。
        **本次抓包只验证了发现阶段**——未实际走通任意一条 PUB; 脚本的
        translate+create_study 编译挂载链路，不要假设与官方指标同一套流程
        必然适用，见分析文档 §8.2。

        无关键词搜索参数：只支持按 sort/type 排序过滤，不支持传关键词
        全文检索。若需要"按关键词找指标"，只能拉全量后本地过滤。
      tags: [技术指标]
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          example: 0
        - name: count
          in: query
          required: false
          schema:
            type: integer
          example: 20
        - name: sort
          in: query
          required: false
          description: 实测枚举 top（按点赞数排序）、trending（趋势上升）
          schema:
            type: string
            enum: [top, trending]
          example: top
        - name: type
          in: query
          required: false
          description: 1=指标（study），2=策略（strategy），省略则混合返回
          schema:
            type: integer
            enum: [1, 2]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PubscriptLibraryResponse'

  /pubscripts-library/editors-picks/:
    get:
      operationId: pubscriptsEditorsPicks
      summary: TradingView 编辑精选的社区脚本
      description: |
        无分页参数，一次性返回。⚠ 抓包实测该响应的 content.encoding
        为 base64，采集实现必须先 base64 解码再当 JSON 解析——
        与 pubscripts-library/ 主端点（明文 JSON）编码方式不一致，
        不能对 pubscripts-* 所有响应一视同仁处理。
      tags: [技术指标]
      responses:
        '200':
          description: 成功（响应体经 base64 编码）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PubscriptLibraryResponse'

  /pubscripts-get/personal-access/:
    get:
      operationId: pubscriptsPersonalAccess
      summary: 当前账号已购买/被授权访问的付费社区脚本清单
      description: |
        需登录会话。本次抓包样本为空（账号未购买任何付费脚本），
        default/paid_package 两个分组的真实结构未被充分样本验证。
      tags: [技术指标]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PubscriptPersonalAccessResponse'


