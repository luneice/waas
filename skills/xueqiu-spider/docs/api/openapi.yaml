      description: |
        ⚠️ **一个端点返回三块互不相干的数据** —— 这是「增发」HAR 中
        没有独立端点的原因：

        | `data` 字段 | 内容 | 本样本条数 |
        | --- | --- | --- |
        | `items` | **分红**（派息/送转） | 12（分 2 页） |
        | `addtions` | **增发** | 2 |
        | `allots` | **配股** | 0（结构未验证） |

        ⚠️ **`page`/`size` 只对 `items` 生效** —— `addtions` / `allots`
        每页原样重复返回（实测 page=1 与 page=2 的 `addtions` 完全相同）。

        ⚠️ 本端点返回**标准的 `size` 条**（不像 `holders` 多返一条），
        终止判据是 `length < size`。本样本共 12 条分红，分 2 页。

        🔴 **分红金额没有结构化字段**，只在 `plan_explain` 中文串里
        （如 `10派69.57元(实施方案)`），须解析，详见 `BonusItem.plan_explain`。

        本端点填补了 §7.5 的 🔴 高严重度缺口「分红/股息记录」。
        注意区分三个"假朋友"：`dividend_payable`（应付股利余额）、
        `cash_paid_of_distribution`（混了利息支出）、
        `dividend_receivable`（方向相反），**都不是分红额**。
      tags: [股权与公司运作]
