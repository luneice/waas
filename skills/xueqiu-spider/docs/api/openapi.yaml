openapi: 3.1.0
info:
  title: 雪球（xueqiu）A 股财务数据 API
  description: |
    雪球个股财务数据接口文档，基于 HAR 抓包逆向整理。
    人读导航、通用约定、字段字典与勾稽关系见同目录 [`README.md`](./README.md)。

    **当前覆盖 10 个端点，分两组**：

    | 组 | 前缀 | 端点 | 样本 |
    | --- | --- | --- | --- |
    | **A · 财务报表** | `finance/cn/**` | 利润表 / 资产负债表 / 现金流量表 / 主要财务指标 | 赛力斯 SH601127 |
    | **B · 股权与公司运作** | `f10/cn/**` | 分红增发 / 十大股东 / 股东人数 / 基金持股 / 限售解禁 / 高管增减持 | 宁德时代 SZ300750 |

    ⚠️ **8 个 B 组 HAR 收敛为 6 个端点**：`bonus.json` 同时承载分红与增发；
    `top_holders.json` 靠 `circula=0/1` 区分全体/流通股东。

    ## 两组的共性与差异

    **完全一致**（可共用同一套实现）：响应信封、`error_code` 语义与类型漂移、
    鉴权（登录态 Cookie）、CORS 策略、导航目标（`/snowman/S/{symbol}/detail`）。

    **必须逐组区分**：

    | 维度 | A 组 | B 组 |
    | --- | --- | --- |
    | 入参 | 统一 5 个 | 各端点不同 |
    | 翻页 | 统一 `timestamp` 游标 | **三种范式并存**（page/size、`locate`、`timestamp`） |
    | `data` 形态 | 统一 `{…, list[]}` | `items` / `fund_items` / 多块并列 |
    | 数值形态 | `[值, 同比]` 二元组 | **标量** |

    ## A 组端点族共性

    四端点的**入参、响应信封、`data` 外层键、翻页机制、鉴权方式完全一致**，
    差异在 `list[]` 的字段集、`type` 的语义正确性与**单位口径**。共用组件见 `components`：
    `SymbolParam` / `TypeParam` / `IsDetailParam` / `CountParam` / `TimestampParam`、
    `FinanceEnvelopeBase` / `FinanceDataBase` / `ValueWithYoY`。

    ⚠️ **前三个是原始报表，`indicator.json` 是衍生指标**，性质不同：
    报表单位统一（元 / 小数同比），indicator **混着百分数、小数、倍数、元/股**四种，
    且与报表有 2 个同名字段口径冲突。**不要当第四张报表同等对待。**

    ## 关键约束

    1. **必须携带登录态 Cookie**。缺 Cookie 时返回 HTTP 400 +
       `error_code: "400016"`（实测）。实现须在已登录的 `https://xueqiu.com`
       页面上下文内发起请求，由浏览器自动附带 Cookie 与 Origin。
    2. **`error_code` 类型会漂移**：成功为 number `0`，失败为 string（如 `"400016"`）。
       判定成功须归一化后比较，且不能只看 HTTP 状态码。
    3. **鉴权失败时 `data.list` 同样为空数组**，必须先判 `error_code` 再判 list，
       否则会把「未登录」误报成「无财务数据」。
    4. **`timestamp` 是翻页游标，不是当前时间**，详见 `TimestampParam`。
    5. **数值可能是科学计数法**（`3.0E8`），原始 JSON 中即如此。
       标准 `JSON.parse` 安全，正则/字符串处理会挂。
    6. 🔴 **`type=S0`–`S4`（单季口径）的语义正确性是 per-field 的，不是 per-endpoint 的**：

       | 端点 | `S` 系列 |
       | --- | --- |
       | `income.json` | ⚠️ 未实测（HAR 未覆盖） |
       | `balance.json` | ❌ 全部字段不可用（存量表，产出负的总资产） |
       | `cash_flow.json` | ⚠️ 36 个流量字段正确，2 个余额字段失真 |
       | `indicator.json` | ⚠️ HAR 未出现（比率差分无意义） |

       实现须按**字段级白名单**处理，不可按端点粗粒度开关。
    7. 🔴 **`indicator.json` 与报表的 2 个同名字段口径冲突**，跨表 join 会静默出错：

       | 字段 | indicator | balance |
       | --- | --- | --- |
       | `asset_liab_ratio` | `65.9226`（百分数） | `0.659226148333026`（小数） |
       | `capital_reserve` | `21.2576`（**每股**资本公积） | `37030444558.6`（资本公积**总额**） |

    ### B 组专属约束

    8. 🔴 **page/size 类端点的每页条数逐端点而异**（已逐一实测）：
       `holders` 返回 `size + 1` 条（末条是下页首条），
       `bonus` / `shareschg` / `skholderchg` 返回标准的 `size` 条。
       故终止判据分别是 `length <= size` 与 `length < size` ——
       **一刀切两个方向都会静默出错**（详见 `SizeParam`）。
    9. 🔴 **分红金额无结构化字段**，只在 `plan_explain` 中文串里
       （`10派69.57元(实施方案)`）。解析失败须返回 `null` 并保留原文，
       **绝不填 0**；`(预案)` 等非「实施方案」状态不能计入已分红。
    10. 🔴 **`org_holding` 的 `fund_items[0]` 是「全部合计」汇总行**，
        不是一只基金 —— 投影时必须剥离。
    11. ⚠️ **日期索引类端点不是翻页**（`top_holders` / `org_holding`）：
        先取 `times[]` 再按 `value` 展开，用 `@Expanded` 而非 `@Paginated`。
        两者参数名还不同（`locate` vs `timestamp`）。
    12. ⚠️ **`top_holders.count` 不控制返回条数** —— 传 200 仍只返回 10 条。
  version: 5.1.0

servers:
  - url: https://stock.xueqiu.com
    description: 财务数据服务（唯一承载业务数据的域名）

security:
  - sessionCookie: []

paths:
  /v5/stock/finance/cn/income.json:
    get:
      operationId: getCnIncomeStatement
      summary: 获取 A 股个股利润表
      description: |
        返回指定 A 股标的的利润表，按报告期倒序。

        **口径为累计值**：每期数据是「年初至该报告期末」的累计数，
        而非单季数。已验证（赛力斯 2025 年 `total_revenue`）：
        一季报 191.47 亿 → 中报 624.02 亿 → 三季报 1105.34 亿 → 年报 1650.54 亿，单调递增。

        **路径中的 `/cn/` 表明仅限 A 股**。港股/美股的同族端点未在抓包中出现，不要臆造路径。
      tags: [财务数据]
      parameters:
        - $ref: '#/components/parameters/SymbolParam'
        - $ref: '#/components/parameters/TypeParam'
        - $ref: '#/components/parameters/IsDetailParam'
        - $ref: '#/components/parameters/CountParam'
        - $ref: '#/components/parameters/TimestampParam'
      responses:
        '200':
          description: |
            请求成功。⚠️ HTTP 200 **不等于**业务成功，仍须校验 `error_code`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeResponse'
              examples:
                成功:
                  summary: 赛力斯 SH601127，type=all
                  value:
                    data:
                      quote_name: 赛力斯
                      currency: CNY
                      currency_name: 人民币
                      org_type: 1
                      last_report_name: 2026一季报
                      statuses: null
                      list:
                        - report_date: 1774886400000
                          report_name: 2026一季报
                          ctime: 1777463147000
                          total_revenue: [25745711786.75, 0.3446285931858831]
                          operating_costs: [25864181222.45, 0.3917663047945134]
                          op: [805558027.55, -0.09242907575178125]
                          profit_total_amt: [848859149.04, -0.048119361700924596]
                          net_profit: [610545316.93, -0.1756409396930466]
                          net_profit_atsopc: [754464672.82, 0.008921162241436175]
                          minority_gal: [-143919355.89, -19.091592985971158]
                          basic_eps: [0.43, -0.14]
                          exchg_gain: [null, null]
                    error_code: 0
                    error_description: ''
        '400':
          description: |
            业务错误。实测触发条件：**缺少登录态 Cookie**。

            ⚠️ 此响应仍带 `data.list: []`，不能凭 list 为空判定"无数据"。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeResponse'
              examples:
                未登录:
                  summary: 无 Cookie 请求（curl 实测，已带齐 Origin/Referer/UA）
                  value:
                    data:
                      list: []
                    error_code: '400016'
                    error_description: 遇到错误，请刷新页面或者重新登录帐号后再试

  /v5/stock/finance/cn/balance.json:
    get:
      operationId: getCnBalanceSheet
      summary: 获取 A 股个股资产负债表
      description: |
        返回指定 A 股标的的资产负债表，按报告期倒序。
        **入参与 `income.json` 完全一致**。

        ## 口径：时点存量，不可跨期相加

        资产负债表是**时点存量表** —— 每期数据是该报告期末当日的**余额**，
        不是期间累计发生额。这与利润表有根本区别：

        | | `income.json` | `balance.json` |
        | --- | --- | --- |
        | 表类型 | 期间流量表 | **时点存量表** |
        | `Q`/`all` 口径 | 年初至期末累计发生额 | 期末**时点余额** |
        | 期间可加性 | ✅ 可加 | ❌ **不可加** |

        ⚠️ 本表数值看起来也逐期递增（987→1129→1215→1439 亿），
        容易误判为累计口径。区分依据是**表的性质**而非数值趋势 ——
        2023 年就出现过中报总资产（370 亿）低于一季报（444 亿）的情况，
        累计口径不可能下降。

        ## 🔴 不要对本端点使用 `type=S0`–`S4`

        `S` 系列是相邻期的**机械差分**。上游对全族端点套用了同一套差分逻辑，
        未区分流量表/存量表。对存量表做差分得到的是「**期间变动额**」而非「余额」，
        产出的数据在会计上是荒谬的：

        | 实测证据 | 数值 | 问题 |
        | --- | --- | --- |
        | `S2`「2023二季度」`total_assets` | **−7,358,094,375.04** | **负的总资产** |
        | `S0`「2025四季度」`asset_liab_ratio` | **−0.0545** | **负的资产负债率** |
        | `S0`「2025四季度」`total_assets` | 22,399,968,216.45 | 实为「四季度总资产**增加** 224 亿」 |

        **实现红线**：不应向用户暴露本端点的 `S` 系列，或必须极醒目地标注
        「本组为相邻期差额（变动额），非时点余额；比率类字段无意义」。
        让 Agent 拿到「总资产 −73.58 亿」而不加解释会直接产出错误结论 ——
        这比返回空数据危险得多，**因为它看起来完全正常**。
      tags: [财务数据]
      parameters:
        - $ref: '#/components/parameters/SymbolParam'
        - $ref: '#/components/parameters/TypeParam'
        - $ref: '#/components/parameters/IsDetailParam'
        - $ref: '#/components/parameters/CountParam'
        - $ref: '#/components/parameters/TimestampParam'
      responses:
        '200':
          description: |
            请求成功。⚠️ HTTP 200 **不等于**业务成功，仍须校验 `error_code`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
              examples:
                成功:
                  summary: 赛力斯 SH601127，type=all（仅列核心汇总项）
                  value:
                    data:
                      quote_name: 赛力斯
                      currency: CNY
                      currency_name: 人民币
                      org_type: 1
                      last_report_name: 2026一季报
                      statuses: null
                      list:
                        - report_date: 1774886400000
                          report_name: 2026一季报
                          ctime: null
                          total_assets: [123747865038.34, 0.25365492920462807]
                          total_liab: [81577828433.66, 0.07573765488632628]
                          total_holders_equity: [42170036604.68, 0.8434702341851736]
                          total_quity_atsopc: [41310177392.59, 0.7863118590375621]
                          minority_equity: [859859212.09, 4.4311316294194265]
                          asset_liab_ratio: [0.659226148333026, -0.1419188567552478]
                          shares: [1741985086, 0.06650009506809364]
                          dividend_receivable: [3.0E8, null]
                          lt_payable_sum: [0.0, null]
                          fixed_asset: [null, null]
                          fixed_asset_sum: [14355796175.65, 0.028196687820616344]
                    error_code: 0
                    error_description: ''
                分页末页:
                  summary: type=Q2 最后一页，返回 4 条 < count=5（上游截断而非报错）
                  value:
                    data:
                      quote_name: 赛力斯
                      last_report_name: 2026一季报
                      list:
                        - report_name: 2017中报
                        - report_name: 2016中报
                        - report_name: 2015中报
                        - report_name: 2014中报
                    error_code: 0
                    error_description: ''
        '400':
          description: |
            业务错误。实测触发条件：**缺少登录态 Cookie**。

            ⚠️ 此响应仍带 `data.list: []`，不能凭 list 为空判定"无数据"。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'

  /v5/stock/finance/cn/cash_flow.json:
    get:
      operationId: getCnCashFlow
      summary: 获取 A 股个股现金流量表
      description: |
        返回指定 A 股标的的现金流量表，按报告期倒序。
        **入参与 `income.json` / `balance.json` 完全一致**。

        ## 口径：期间累计（与利润表同类）

        `Q`/`all` 口径为「年初至该报告期末的累计发生额」。
        已验证（赛力斯 2025 年 `ncf_from_oa`）：
        一季报 −76.30 亿 → 中报 +144.37 亿 → 三季报 +226.49 亿 → 年报 +289.14 亿。

        ⚠️ **本表累计值可以下降甚至为负**（经营现金流本身可正可负），
        不能像利润表那样用「单调递增」来判定累计口径。

        ## ✅ `S` 系列在本表基本可用（与资产负债表相反）

        对**期间流量**做差分得到单季发生额是有意义的。已验算：

        ```
        S0「2025四季度」ncf_from_oa 6,264,296,304.74
          = 2025年报 28,913,743,329.24 − 2025三季报 22,649,447,024.50  ✅ 精确吻合
        ```

        `S4`（四季度）= 年报 − 三季报，是**上市公司不单独披露的 Q4 单季数据**，
        对季度环比分析很有价值。`S1` 与 `Q1` 数值完全相同（一季度无需差分）。

        ## 🔴 但 2 个时点余额字段在 `S` 口径下失真

        现金流量表**不是纯流量表**，混着 2 个时点余额字段：

        | 字段 | `S` 口径下的表现 |
        | --- | --- |
        | `initial_balance_of_cce` | **恒变成 `0.0`**（Q2–Q4） |
        | `final_balance_of_cce` | **退化成等于当季净增额** |

        实测（`type=S0`，赛力斯）：

        | 期次 | 期初 | 期末 | 净增 | 判定 |
        | --- | --- | --- | --- | --- |
        | 2026一季度 | 483.63 亿 | 221.49 亿 | −262.15 亿 | ✅ 正确（S1 无需差分） |
        | 2025四季度 | **0.0** | 216.79 亿 | 216.79 亿 | ❌ 期末 == 净增 |
        | 2025三季度 | **0.0** | 50.19 亿 | 50.19 亿 | ❌ 同上 |
        | 2025二季度 | **0.0** | 118.46 亿 | 118.46 亿 | ❌ 同上 |
        | 2025一季度 | 63.34 亿 | 98.19 亿 | 34.85 亿 | ✅ 正确（Q1 无需差分） |

        对照 `all` 口径：2025 四季度末现金真实值为 **483.63 亿**，而非 216.79 亿。

        **实现要求**：`type=S*` 时这 2 个字段必须置 `null` 并标注不可用。

        > 🔴 **这比资产负债表的坑更隐蔽**：balance 的 `S` 系列会产出负的总资产，
        > 一眼可识破；而这里失真后**仍是正的、量级合理的数字**，
        > 从结果完全看不出错误 —— 但它把「期末余额」悄悄换成了「当季净增」。
        > 这类错误必须在采集层拦掉，不能指望下游发现。
      tags: [财务数据]
      parameters:
        - $ref: '#/components/parameters/SymbolParam'
        - $ref: '#/components/parameters/TypeParam'
        - $ref: '#/components/parameters/IsDetailParam'
        - $ref: '#/components/parameters/CountParam'
        - $ref: '#/components/parameters/TimestampParam'
      responses:
        '200':
          description: |
            请求成功。⚠️ HTTP 200 **不等于**业务成功，仍须校验 `error_code`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowResponse'
              examples:
                成功:
                  summary: 赛力斯 SH601127，type=all（仅列汇总项）
                  value:
                    data:
                      quote_name: 赛力斯
                      currency: CNY
                      currency_name: 人民币
                      org_type: 1
                      last_report_name: 2026一季报
                      statuses: null
                      list:
                        - report_date: 1774886400000
                          report_name: 2026一季报
                          ctime: null
                          sub_total_of_ci_from_oa: [27732075659.51, null]
                          sub_total_of_cos_from_oa: [48682370800.99, null]
                          ncf_from_oa: [-20950295141.48, -1.745529702966212]
                          ncf_from_ia: [-4352042841.04, null]
                          ncf_from_fa: [-622559136.30, null]
                          effect_of_exchange_chg_on_cce: [-289640112.54, -1789.2613168589469]
                          net_increase_in_cce: [-26214537231.36, -8.522216005043523]
                          initial_balance_of_cce: [48363264815.25, 6.635884897676052]
                          final_balance_of_cce: [22148727583.89, 1.2557858344429862]
                          cash_received_of_borrowing: [6.0E7, -0.9920074597042761]
                    error_code: 0
                    error_description: ''
                S口径失真:
                  summary: type=S0 第 2 条 —— 期初恒为 0、期末退化成净增（❌ 不可直接使用）
                  value:
                    data:
                      quote_name: 赛力斯
                      list:
                        - report_name: 2025四季度
                          ncf_from_oa: [6264296304.740002, null]
                          initial_balance_of_cce: [0.0, null]
                          final_balance_of_cce: [21678985881.74, null]
                          net_increase_in_cce: [21678985881.739998, null]
                    error_code: 0
                    error_description: ''
        '400':
          description: |
            业务错误。实测触发条件：**缺少登录态 Cookie**。

            ⚠️ 此响应仍带 `data.list: []`，不能凭 list 为空判定"无数据"。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashFlowResponse'

  /v5/stock/finance/cn/indicator.json:
    get:
      operationId: getCnFinancialIndicator
      summary: 获取 A 股个股主要财务指标
      description: |
        返回指定 A 股标的的主要财务指标（ROE、毛利率、周转率、每股指标等），
        按报告期倒序。**入参与三张报表完全一致**。

        ## 与三张报表的根本区别

        前三个端点是**原始报表**（上游披露的科目原值），本端点是**衍生指标**
        （由报表数据计算出的比率、每股值、周转率）。这带来三个特有陷阱：

        ### 🔴 1. 单位在同一张表内不统一

        报表可以「金额一律元、同比一律小数」一刀切，**本表不行**：

        | 单位 | 字段示例 | 值 |
        | --- | --- | --- |
        | **百分数** | `asset_liab_ratio` | `65.9226` = 65.92% |
        | **小数比率** | `ncf_from_oa_to_total_liab` | `-0.2568` = −25.68% |
        | **倍/次** | `current_ratio` | `1.0687` 倍 |
        | **天** | `cash_cycle` | `-130.9449` 天 |
        | **元** | `total_revenue` | `25745711786.75` |
        | **元/股** | `np_per_share` | `23.7144` |

        前两行**在同一个报告期对象里**，一个百分数一个小数 ——
        任何统一处理都会让一半字段错 100 倍。
        实现须维护逐字段的单位表并在信封 `units` 中透出，**不做单位归一化**。

        ### 🔴 2. 与 `balance.json` 有 2 个同名字段口径冲突

        | 字段 | indicator | balance | 冲突 |
        | --- | --- | --- | --- |
        | `asset_liab_ratio` | `65.9226` | `0.659226148333026` | 单位差 100 倍 |
        | `capital_reserve` | `21.2576` | `37030444558.6` | **语义完全不同** |

        `capital_reserve` 已精确验证：balance 的资本公积总额 37,030,444,558.6
        ÷ 股本 1,741,985,086 = 21.2576，即 indicator 给的是**每股**资本公积。

        跨表 join 时若做 `{...balanceRow, ...indicatorRow}` 合并，
        370 亿的真实值会被 21.2576 静默覆盖且**不报错**。

        > 与 `income.json` 同名的 4 个字段（`total_revenue` / `net_profit_atsopc` /
        > `net_profit_after_nrgal_atsolc` / `basic_eps`）则**数值完全一致**，join 安全。

        ### ⚠️ 3. 三个字段名与实际语义不符

        | 字段 | 望文生义 | 实际语义 |
        | --- | --- | --- |
        | `np_per_share` | 每股净**利润** | **每股净资产**（`np` = net property） |
        | `holder_equity` | 股东权益**金额** | **权益比率**（权益 ÷ 总资产 × 100） |
        | `capital_reserve` | 资本公积总额 | **每股**资本公积 |

        `np_per_share` 尤其危险：赛力斯每股净资产 23.71 元、每股收益 0.43 元，
        相差 55 倍，混淆会得出荒谬的估值结论。

        ## 入参：HAR 中未出现 `S` 系列

        本端点抓包只见 `all` / `Q1`–`Q4`，**没有 `S0`–`S4`**。
        这符合逻辑——对比率做差分没有意义。

        但**不能据此断定上游拒绝 `S` 系列**（未实测）。按形状校验放行，
        若上游确实返回 `S` 数据，那些值大概率无意义。

        ## 翻页：历史最深，且早期数据不完整

        本 HAR 翻页链最长（一路到 2011 年，14 次请求）。末页返回 3 条 < `count=5`，
        期次为 2013一季报 / 2012年报 / 2011年报 —— **中间期次有跳跃缺失**。

        早期数据不完整是上游真实状态，**不是采集失败**。
        回写时不要假设期次连续，也不要用「缺失=0」填补。
      tags: [财务数据]
      parameters:
        - $ref: '#/components/parameters/SymbolParam'
        - $ref: '#/components/parameters/TypeParam'
        - $ref: '#/components/parameters/IsDetailParam'
        - $ref: '#/components/parameters/CountParam'
        - $ref: '#/components/parameters/TimestampParam'
      responses:
        '200':
          description: |
            请求成功。⚠️ HTTP 200 **不等于**业务成功，仍须校验 `error_code`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorResponse'
              examples:
                成功:
                  summary: 赛力斯 SH601127，type=all（注意同一行内单位混合）
                  value:
                    data:
                      quote_name: 赛力斯
                      currency: CNY
                      currency_name: 人民币
                      org_type: 1
                      last_report_name: 2026一季报
