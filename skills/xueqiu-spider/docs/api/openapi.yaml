    CashFlowPeriod:
      type: object
      description: |
        单个报告期的现金流量表数据。

        **口径为期间累计发生额**（年初至该报告期末），与利润表同类。
        ⚠️ 但本表累计值**可以下降甚至为负**（经营现金流本身可正可负），
        不能像利润表那样用「单调递增」判定累计口径。

        共 41 个字段：`report_date` / `report_name` / `ctime` 三个标量 +
        **38 个 `ValueWithYoY` 二元组**（36 个流量字段 + 2 个时点余额字段）。

        ## 命名规律

        | 缩写 | 含义 |
        | --- | --- |
        | `oa` / `ia` / `fa` | operating / investing / financing activities |
        | `ci` / `cos` | cash inflow / cash outflow |
        | `ncf` | net cash flow |
        | `cce` | cash and cash equivalents |

        于是 `sub_total_of_ci_from_oa` = 经营活动现金流入小计。

        字段中文名的说明：表头映射表不在本次抓包的前端资源中，
        以下中文名依据勾稽关系验算与会计准则推定。
        标注「勾稽验证」的项已用赛力斯 2026Q1 实数验算通过（README §5.5 列出全部九组等式）。
      properties:
        # ── 标量字段 ──────────────────────────────────────────
        report_date:
          type: integer
          format: int64
          description: |
            报告期末日期，**毫秒**时间戳，恒为该期最后一日 00:00:00 **东八区**。
            同时是翻页游标的来源：下一页传 `report_date + 1`。
          example: 1774886400000
        report_name:
          type: string
          description: |
            报告期名称。

            ⚠️ **措辞区分口径**：`type=all/Q*` 时为「2026一季**报**」（累计发生额），
            `type=S*` 时为「2026一季**度**」（单季差分）。
            唯一的文本差异是「报」vs「度」，极易看漏。
          example: 2026一季报
        ctime:
          type: ['null', integer]
          format: int64
          description: |
            数据入库时间（毫秒）。

            ⚠️ **本端点抓包中恒为 `null`**（与 `balance.json` 一致）；
            三端点中只有 `income.json` 的同名字段有值。
          example: null

        # ── 三大活动汇总（全部勾稽验证） ─────────────────────────────
        sub_total_of_ci_from_oa:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            经营活动现金流入小计（勾稽验证）
        sub_total_of_cos_from_oa:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            经营活动现金流出小计（勾稽验证）
        ncf_from_oa:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            **经营活动产生的现金流量净额**（勾稽验证）。
            `sub_total_of_ci_from_oa - sub_total_of_cos_from_oa == ncf_from_oa`
        sub_total_of_ci_from_ia:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            投资活动现金流入小计（勾稽验证）
        sub_total_of_cos_from_ia:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            投资活动现金流出小计（勾稽验证）
        ncf_from_ia:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            **投资活动产生的现金流量净额**（勾稽验证）
        sub_total_of_ci_from_fa:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            筹资活动现金流入小计（勾稽验证）
        sub_total_of_cos_from_fa:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            筹资活动现金流出小计（勾稽验证）
        ncf_from_fa:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            **筹资活动产生的现金流量净额**（勾稽验证）

        # ── 经营活动明细 ─────────────────────────────
        cash_received_of_sales_service:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            销售商品、提供劳务收到的现金（勾稽验证）
        refund_of_tax_and_levies:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            收到的税费返还（勾稽验证）
        cash_received_of_othr_oa:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            收到其他与经营活动有关的现金（勾稽验证）
        goods_buy_and_service_cash_pay:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            购买商品、接受劳务支付的现金（勾稽验证）
        cash_paid_to_employee_etc:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            支付给职工以及为职工支付的现金（勾稽验证）
        payments_of_all_taxes:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            支付的各项税费（勾稽验证）
        othrcash_paid_relating_to_oa:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            支付其他与经营活动有关的现金（勾稽验证）

        # ── 投资活动明细 ─────────────────────────────
        cash_received_of_dspsl_invest:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            收回投资收到的现金（dspsl = disposal）（勾稽验证）
        invest_income_cash_received:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            取得投资收益收到的现金（勾稽验证）
        net_cash_of_disposal_assets:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            处置固定资产、无形资产和其他长期资产收回的现金净额（勾稽验证）
        net_cash_of_disposal_branch:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            处置子公司及其他营业单位收到的现金净额。本样本为 `null`
        cash_received_of_othr_ia:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            收到其他与投资活动有关的现金（勾稽验证）
        cash_paid_for_assets:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            购建固定资产、无形资产和其他长期资产支付的现金（勾稽验证）
        invest_paid_cash:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            投资支付的现金（勾稽验证）
        net_cash_amt_from_branch:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            取得子公司及其他营业单位支付的现金净额。本样本为 `null`
        othrcash_paid_relating_to_ia:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            支付其他与投资活动有关的现金。本样本为 `null`

        # ── 筹资活动明细 ─────────────────────────────
        cash_received_of_absorb_invest:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            吸收投资收到的现金。本样本为 `null`
        cash_received_from_investor:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            其中：子公司吸收少数股东投资收到的现金。本样本为 `null`
        cash_received_of_borrowing:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            取得借款收到的现金（勾稽验证）。
            本样本值为 `6.0E7`（科学计数法，表示 6000 万）
        cash_received_from_bond_issue:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            发行债券收到的现金。本样本为 `null`
        cash_received_of_othr_fa:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            收到其他与筹资活动有关的现金（勾稽验证）
        cash_pay_for_debt:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            偿还债务支付的现金（勾稽验证）。
            本样本值为 `2.1792855E8`（科学计数法）
        cash_paid_of_distribution:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            分配股利、利润或偿付利息支付的现金（勾稽验证）
        branch_paid_to_minority_holder:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            其中：子公司支付给少数股东的股利、利润。本样本为 `null`
        othrcash_paid_relating_to_fa:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            支付其他与筹资活动有关的现金（勾稽验证）

        # ── 现金余额（⚠️ 含 2 个在 S 口径下失真的时点字段） ─────────────────────────────
        effect_of_exchange_chg_on_cce:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            汇率变动对现金及现金等价物的影响（勾稽验证）。
            **流量字段**，`S` 口径下正确
        net_increase_in_cce:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            现金及现金等价物净增加额（勾稽验证）。
            `ncf_from_oa + ncf_from_ia + ncf_from_fa + effect_of_exchange_chg_on_cce == net_increase_in_cce`

            **流量字段**，`S` 口径下正确
        initial_balance_of_cce:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            期初现金及现金等价物余额。

            🔴 **这是时点余额字段，`type=S*` 时失真** —— 第 2~4 季恒变成 `0.0`。
            实现须在 `S` 口径下置 `null` 并标注不可用，详见路径级说明。
        final_balance_of_cce:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            期末现金及现金等价物余额（勾稽验证）。
            `initial_balance_of_cce + net_increase_in_cce == final_balance_of_cce`

            🔴 **这是时点余额字段，`type=S*` 时失真** —— 退化成等于当季净增额。
            危险之处在于失真后**仍是正的、量级合理的数字**，从结果看不出错误。
            （实测：2025四季度真实期末余额 483.63 亿，`S0` 返回 216.79 亿）

            ⚠️ 另注意本字段与 `balance.json` 的 `currency_funds`（货币资金）**口径不同**：
            2026Q1 分别为 221.49 亿 / 638.54 亿，差额为受限资金。不可混用。

    IndicatorPeriod:
      type: object
      description: |
        单个报告期的主要财务指标。

        **本 schema 与三张报表性质不同** —— 报表是上游披露的原始科目，
        本端点是**由报表计算出的衍生指标**（比率、每股值、周转率）。

        共 38 个字段：`report_date` / `report_name` / `ctime` 三个标量 +
        **35 个 `ValueWithYoY` 二元组**。

        ## 🔴 单位在同一张表内不统一

        报表可以「金额一律元、同比一律小数」一刀切，**本表不行**：

        | 单位 | 字段示例 | 值 |
        | --- | --- | --- |
        | **百分数** | `asset_liab_ratio` | `65.9226` = 65.92% |
        | **小数比率** | `ncf_from_oa_to_total_liab` | `-0.2568` = −25.68% |
        | **倍/次** | `current_ratio` | `1.0687` 倍 |
        | **天** | `cash_cycle` | `-130.9449` 天 |
        | **元** | `total_revenue` | `25745711786.75` |
        | **元/股** | `np_per_share` | `23.7144` |

        上面前两行**在同一个报告期对象里**，一个百分数一个小数 ——
        任何统一处理都会让一半字段错 100 倍。
        每个字段的单位见其 `description` 的「单位」行。

        ## 🔴 与报表的 2 个同名字段口径冲突

        `asset_liab_ratio`（单位差 100 倍）与 `capital_reserve`（语义完全不同）
        和 `balance.json` 冲突，跨表 join 会静默出错。详见各字段说明。

        ## ⚠️ 三个字段名与实际语义不符

        `np_per_share` = 每股净**资产**（非净利润）、
        `holder_equity` = 权益**比率**（非金额）、
        `capital_reserve` = **每股**资本公积（非总额）。

        字段中文名的说明：表头映射表不在本次抓包的前端资源中，
        以下中文名依据**数值反算**推定。标注「精确命中」的项已用赛力斯 2026Q1
        实数验算通过（README §6.6 列出全部算式）。
      properties:
        # ── 标量字段 ──────────────────────────────────────────
        report_date:
          type: integer
          format: int64
          description: |
            报告期末日期，**毫秒**时间戳，恒为该期最后一日 00:00:00 **东八区**。
            同时是翻页游标的来源：下一页传 `report_date + 1`。
          example: 1774886400000
        report_name:
          type: string
          description: |
            报告期名称。

            ⚠️ 本端点 HAR 中**未出现 `S` 系列**，故只见「…季**报**」措辞。
          example: 2026一季报
        ctime:
          type: ['null', integer]
          format: int64
          description: |
            数据入库时间（毫秒）。

            本端点**有值**（如 `1777463147000`），与 `income.json` 一致；
            `balance.json` / `cash_flow.json` 的同名字段恒为 `null`。
          example: 1777463147000

        # ── 盈利能力（单位：% ） ────────────────────
        avg_roe:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            净资产收益率（**平均**口径）

            单位：**百分数**（`65.9226` 表示 65.92%）

            归母净利 ÷ **平均**归母权益 × 100 = 1.8350 ≈ 字段值 `1.83`。

            ⚠️ 与 `ore_dlt`（摊薄口径）是一对，数值不同（1.83 vs 1.8263），
            回写时必须说明口径，不可混用或二选一。
            （字段仅 2 位精度，无法与期末口径 1.8263 严格区分，
            但字段名 `avg` 与 `ore_dlt` 的存在共同指向平均口径）
        ore_dlt:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            净资产收益率（**摊薄**口径，dlt = diluted）

            单位：**百分数**（`65.9226` 表示 65.92%）

            归母净利 754,464,672.82 ÷ **期末**归母权益 41,310,177,392.59 × 100
            = 1.8263 ✅ **精确命中**
        net_interest_of_total_assets:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            总资产净利率

            单位：**百分数**（`65.9226` 表示 65.92%）

            净利润 610,545,316.93 ÷ **平均**总资产 ((143,905,863,420.75+123,747,865,038.34)/2) × 100
            = 0.45622 ✅ **精确命中**（注意分母是平均总资产，非期末）
        gross_selling_rate:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            毛利率

            单位：**百分数**（`65.9226` 表示 65.92%）

            (营收 25,745,711,786.75 − 营业成本 18,990,470,700.37) ÷ 营收 × 100
            = 26.2383 ✅ **精确命中**
        net_selling_rate:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            净利率

            单位：**百分数**（`65.9226` 表示 65.92%）

            **净利润**（含少数股东）610,545,316.93 ÷ 营收 × 100 = 2.3714 ✅ **精确命中**

            ⚠️ 分子用的是 `net_profit` 而非 `net_profit_atsopc`。
            用归母净利算得 2.9304，与字段值不符。

        # ── 每股指标（单位：元/股） ────────────────────
        basic_eps:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            基本每股收益

            单位：**元/股**

            与 `income.json` 的同名字段**数值完全一致**（0.43），跨表 join 安全。
        np_per_share:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            **每股净资产**

            单位：**元/股**

            🔴 **不是「每股净利润」** —— `np` = net **property**，不是 net profit。

            归母权益 41,310,177,392.59 ÷ 股本 1,741,985,086 = 23.7144 ✅ **精确命中**

            ⚠️ 赛力斯 2026Q1 每股净资产 23.71 元、每股收益（`basic_eps`）0.43 元，
            相差 55 倍。当成「每股净利润」会得出荒谬的估值结论。
        undistri_profit_ps:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            每股未分配利润

            单位：**元/股**

            未分配利润 1,777,233,986.07 ÷ 股本 = 1.0202 ✅ **精确命中**
        operate_cash_flow_ps:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            每股经营现金流

            单位：**元/股**

            经营活动现金流净额 −20,950,295,141.48 ÷ 股本 = −12.0267 ✅ **精确命中**
        capital_reserve:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            **每股**资本公积

            单位：**元/股**

            🔴 **与 `balance.json` 的同名字段语义完全不同**：

            ```
            balance.capital_reserve  = 37,030,444,558.6   （资本公积总额，元）
                     ÷ 股本 1,741,985,086
            = 21.2576  == indicator.capital_reserve  ✅ 精确命中
            ```

            跨表 join 时若做 `{...balanceRow, ...indicatorRow}` 合并，
            370 亿的真实值会被 21.2576 静默覆盖且**不报错**。
            实现须加命名空间前缀或显式排除本字段。

        # ── 偿债能力与资本结构（⚠️ 单位混合：% / 小数 / 倍） ────────────────────
        asset_liab_ratio:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            资产负债率

            单位：**百分数**（`65.9226` 表示 65.92%）

            🔴 **与 `balance.json` 的同名字段单位差 100 倍**：

            | 来源 | 值 |
            | --- | --- |
            | `indicator.json` | `65.9226`（百分数，且精度截断至 4 位） |
            | `balance.json` | `0.659226148333026`（小数，全精度） |

            跨表 join 会静默出错。
        holder_equity:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            **权益比率**（股东权益占比）

            单位：**百分数**（`65.9226` 表示 65.92%）

            🔴 **不是「股东权益金额」** —— balance 里权益是百亿级，这里是 34.0774。

            全部所有者权益 42,170,036,604.68 ÷ 总资产 123,747,865,038.34 × 100
            = 34.0774 ✅ **精确命中**

            互补验证：`holder_equity 34.0774 + asset_liab_ratio 65.9226 = 100.0000` ✅
        current_ratio:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            流动比率

            单位：**倍/次**

            流动资产 78,613,668,121.96 ÷ 流动负债 73,560,772,941.76 = 1.0687 ✅ **精确命中**
        quick_ratio:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            速动比率

            单位：**倍/次**

            ⚠️ **推定，未精确验证**。

            标准公式 (流动资产 − 存货) ÷ 流动负债 = 1.0421，与字段值 `0.91` **不符**。
            按「货币资金 + 交易性金融资产 + 应收票据及账款 + 预付款项」÷ 流动负债
            算得 0.9127，接近但因字段仅 2 位精度**无法确证**。
        equity_ratio:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            产权比率

            单位：**倍/次**

            负债合计 81,577,828,433.66 ÷ **归母**权益 41,310,177,392.59 = 1.9748 ✅ **精确命中**

            ⚠️ 分母是**归母**权益，与 `equity_multiplier`（用全部权益）**口径不同**。
        equity_multiplier:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            权益乘数

            单位：**倍/次**

            总资产 123,747,865,038.34 ÷ **全部**所有者权益 42,170,036,604.68 = 2.9345 ✅ **精确命中**

            ⚠️ 分母是**全部**权益（含少数股东），与 `equity_ratio`（用归母权益）**口径不同**。
            做杜邦分解时若假设二者同分母会推错。
        ncf_from_oa_to_total_liab:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            经营现金流 / 总负债

            单位：**小数比率**（`-0.2568` 表示 −25.68%）

            经营活动现金流净额 −20,950,295,141.48 ÷ 负债合计 81,577,828,433.66
            = −0.2568 ✅ **精确命中**

            🔴 **本表唯一的小数比率字段** —— 同一行里 `asset_liab_ratio` 是百分数（65.9226），
            本字段却是小数（−0.2568）。任何统一处理都会错 100 倍。

        # ── 营运效率（单位：次 / 天） ────────────────────
        inventory_turnover:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            存货周转率

            单位：**倍/次**

            本期营业成本 ÷ 存货。字段值 8.6251
        inventory_turnover_days:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            存货周转天数

            单位：**天**

            90 ÷ `inventory_turnover` 8.6251 = 10.4347 ✅ **精确命中**

            ⚠️ **基数是报告期实际天数（一季报 90 天），不是 360 天**。
            年报期的基数未验证，跨期比较周转天数须注意。
        account_receivable_turnover:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            应收账款周转率

            单位：**倍/次**

            字段值 15.9825
        receivable_turnover_days:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            应收账款周转天数

            单位：**天**

            90 ÷ `account_receivable_turnover` 15.9825 = 5.6312 ✅ **精确命中**
        accounts_payable_turnover:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            应付账款周转率

            单位：**倍/次**

            字段值 0.6122
        accounts_payable_turnover_days:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            应付账款周转天数

            单位：**天**

            90 ÷ `accounts_payable_turnover` 0.6122 = 147.0108 ✅ **精确命中**
        total_capital_turnover:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            总资产周转率

            单位：**倍/次**

            字段值 0.1924
        current_asset_turnover_rate:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            流动资产周转率

            单位：**倍/次**

            字段值 0.2903
        fixed_asset_turnover_ratio:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            固定资产周转率

            单位：**倍/次**

            字段值 1.7728
        operating_cycle:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            营业周期

            单位：**天**

            `inventory_turnover_days` 10.4347 + `receivable_turnover_days` 5.6312
            = 16.0659 ✅ **精确命中**
        cash_cycle:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            现金循环周期

            单位：**天**

            `operating_cycle` 16.0659 − `accounts_payable_turnover_days` 147.0108
            = −130.9449 ✅ **精确命中**

            ⚠️ **为负是正常的**（−131 天），表示占用上游资金，
            是强势产业链地位的体现，**不是数据错误**。

        # ── 成长能力（单位：% ，⚠️ 与二元组同比重复但差 100 倍） ────────────────────
        operating_income_yoy:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            营业收入同比增长率

            单位：**百分数**（`65.9226` 表示 65.92%）

            🔴 **与同一行 `total_revenue[1]` 是同一个数，但单位差 100 倍**：
            本字段 `[0]` = 34.4629（百分数），`total_revenue[1]` = 0.3446（小数）。

            🔴 **本字段自己的 `[1]` = 2.2347 是「同比增长率的同比」**（二阶量），
            意为「营收增速本身比去年同期的增速涨了 2.23 倍」，
            **极易误读成「营收增长 223%」**。建议投影层丢弃或改名为 `yoyOfYoy`。
        net_profit_atsopc_yoy:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            归母净利润同比增长率

            单位：**百分数**（`65.9226` 表示 65.92%）

            `[0]` = 0.8921（百分数）vs `net_profit_atsopc[1]` = 0.008921（小数），差 100 倍。
            `[1]` 是增速的同比（二阶量），见 `operating_income_yoy` 说明。
        np_atsopc_nrgal_yoy:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            归母**扣非**净利润同比增长率

            单位：**百分数**（`65.9226` 表示 65.92%）

            `[0]` = −73.8735（百分数）vs `net_profit_after_nrgal_atsolc[1]` = −0.7387（小数），差 100 倍。
            `[1]` 是增速的同比（二阶量）。

        # ── 原始金额搬运（单位：元，与 income.json 数值一致） ────────────────────
        total_revenue:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            营业总收入

            单位：**元**

            与 `income.json` 的同名字段**数值完全一致**（25,745,711,786.75），跨表 join 安全。
        net_profit_atsopc:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            归属于母公司股东的净利润

            单位：**元**

            与 `income.json` 的同名字段**数值完全一致**（754,464,672.82），跨表 join 安全。
        net_profit_after_nrgal_atsolc:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            归母扣非净利润

            单位：**元**

            与 `income.json` 的同名字段**数值完全一致**（102,900,401.65），跨表 join 安全。

        # ── 语义未确认 ────────────────────
        rop:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            ⚠️ **语义未确认**

            单位：**未知**

            🔴 **本字段语义未能破解，实现时应原样透传并标注未知，不要编中文名。**

            本样本值 `73.0061`。已排除的口径（均不匹配）：

            | 尝试 | 计算值 |
            | --- | --- |
            | 营业成本 / 营收 × 100 | 73.7617 |
            | 营业成本 / 营业总成本 × 100 | 73.4238 |
            | 营业总成本 / 营收 × 100 | 100.4602 |
            | (营收 − 营业利润) / 营收 × 100 | 96.8711 |
            | 每股营收 | 14.7795 |

            跨期观察：74.10（2025Q1）→ 143.26（中报）→ 157.86（三季报）
            → 100.64（年报）→ 73.01（2026Q1），呈期内累积后回落形态，不像稳定比率。

            不要凭字段名猜测（`rop` 疑似 return on ...，但所有 return 类口径已排除）。

    # ══════════════════════════════════════════════════════════
    # B 组 · 股权与公司运作（f10/cn/**）
    # ══════════════════════════════════════════════════════════

    F10EnvelopeBase:
      type: object
      description: |
        f10 端点族的响应信封外层。

        ⚠️ **与 A 组的 `FinanceEnvelopeBase` 结构完全相同**
        （`error_code` 类型漂移、`400016` 语义都一致），
        但 `data` 内部形态各端点不同（有的 `items`、有的 `fund_items`、
        有的多块并列），故不共用同一个 `data` 基类。
      required: [data, error_code]
      properties:
        error_code:
          description: |
            ⚠️ **类型会漂移**：成功时为 number `0`，失败时为 string（如 `"400016"`）。
            判定须归一化：`Number(error_code) === 0`。
          oneOf:
            - type: integer
            - type: string
          examples: [0, '400016']
        error_description:
          type: string
          example: ''

    # ── 分红 / 增发 / 配股 ──────────────────────────────────
    BonusResponse:
      allOf:
        - $ref: '#/components/schemas/F10EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/BonusData'

    BonusData:
      type: object
      description: |
        ⚠️ **一个端点返回三块互不相干的数据** —— 这是「增发」HAR 中
        没有独立端点的原因。

        ⚠️ **`page`/`size` 只对 `items`（分红）生效**：`addtions` / `allots`
        在每一页都**原样重复返回**（实测 page=1 与 page=2 的 `addtions`
        完全相同）。跨页合并时若把它们也 concat，会得到重复数据。
      properties:
        items:
          type: array
          description: 分红记录（派息/送转），受 page/size 分页
          items:
            $ref: '#/components/schemas/BonusItem'
        addtions:
          type: array
          description: |
            增发记录。⚠️ 上游拼写为 `addtions`（缺 i），原样保留。
            **不受分页影响，每页重复返回全量。**
          items:
            $ref: '#/components/schemas/AdditionItem'
        allots:
          type: array
          description: |
            配股记录。**本样本为空数组**（宁德时代无配股），
            字段结构**未验证** —— 实现时按 `unknown[]` 透传，不要臆造字段名。
          items:
            type: object

    BonusItem:
      type: object
      description: 单条分红记录
      properties:
        dividend_year:
          type: string
          description: |
            分红所属期。

            ⚠️ **两种格式并存**：
            - 报告期格式：`2025年报` / `2026中报`
            - 日期格式：`2024-12-11`（不与定期报告绑定的**特别分红**）

            按报告期与三张报表 join 时，日期格式的记录会**漏配**。
            算「某年度分红总额」须把日期格式的记录也归入对应年份。
          example: 2025年报
        plan_explain:
          type: string
          description: |
            🔴 **分配方案说明 —— 分红金额的唯一来源**。

            上游**不提供** `dividend_per_share` 一类结构化数值字段，
            金额只能从这个中文串解析。

            本样本已见的**全部**形态（⚠️ 单一标的样本，不是 A 股全集）：

            | 形态 | 示例 | 含义 |
            | --- | --- | --- |
            | 纯派息 | `10派69.57元(实施方案)` | 每 10 股派 69.57 元（税前） |
            | 转增+派息 | `10转8股派25.2元(实施方案)` | 每 10 股转增 8 股 + 派 25.2 元 |

            **A 股实际还存在但本样本未出现**的形态（实现必须容错）：
            `10送3股派2元`（送股，税务处理与转增不同）、`10转10股`（纯转增）、
            `不分配不转增` 等。

            **实现要求**：
            1. 用宽松正则 + **显式失败** —— 解析不出金额时返回 `null` 并保留
               原文，**绝不能猜或填 0**（否则「未分红」与「解析失败」混为一谈）；
            2. 投影层**必须同时保留原文**供消费方核对；
            3. `(实施方案)` 后缀表示**已实施**。若出现 `(预案)` /
               `(股东大会通过)` 等状态，含义完全不同（尚未实施），
               **不能计入已分红金额**。本样本全是「实施方案」，其它状态未验证。
          example: 10派69.57元(实施方案)
        equity_date:
          type: [integer, 'null']
          format: int64
          description: 股权登记日（毫秒时间戳）
          example: 1776700800000
        ex_dividend_date:
          type: [integer, 'null']
          format: int64
          description: 除权除息日（毫秒）
          example: 1776787200000
        ashare_ex_dividend_date:
          type: [integer, 'null']
          format: int64
          description: A 股除权除息日（毫秒）。本样本与 `ex_dividend_date` 相同
          example: 1776787200000
        dividend_date:
          type: [integer, 'null']
          format: int64
          description: 派息日（毫秒）
          example: 1776787200000
        cancle_dividend_date:
          type: [integer, 'null']
          format: int64
          description: |
            取消分红日（毫秒）。⚠️ 上游拼写为 `cancle`（应为 cancel），
            **原样保留**，改对了会取不到值。

            非 `null` 表示该次分红**已被取消**，计算分红总额时须排除。
          example: null

    AdditionItem:
      type: object
      description: |
        单条增发记录。

        **已验证勾稽**（宁德时代 2022 年定增）：
        ```
        109,756,097 股 × 410.0 元/股 = 45,000,000,000 元（毛额）
        actual_rc_net_amt            = 44,870,113,208 元（净额）
        差额                          =    129,886,792 元 ← 发行费用
        ```
        净额 ≈ 毛额 − 发行费用，符合「净额」定义 ✅
      properties:
        actual_issue_vol:
          type: number
          description: |
            实际发行数量（**股**）。
            ⚠️ 上游值带浮点噪声（`109756097.00000001`），投影时按需取整，
            但不要四舍五入到万/亿。
          example: 109756097.00000001
        actual_issue_price:
          type: number
          description: 实际发行价（元/股）
          example: 410.0
        actual_rc_net_amt:
          type: number
          description: 实际募集资金**净额**（元，已扣发行费用）
          example: 44870113208
        listing_ad:
          type: [integer, 'null']
          format: int64
          description: 增发股份上市日（毫秒时间戳）
          example: 1656518400000

    # ── 十大股东 / 十大流通股东 ──────────────────────────────
    TopHoldersResponse:
      allOf:
        - $ref: '#/components/schemas/F10EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TopHoldersData'

    TopHoldersData:
      type: object
      properties:
        items:
          type: array
          description: 前十大股东（口径由 `circula` 决定）
          items:
            $ref: '#/components/schemas/HolderItem'
        total:
          $ref: '#/components/schemas/HolderTotal'
        quit:
          type: array
          description: |
            本期**退出**前十的股东。

            ⚠️ **比 `items[]` 多一个字段 `holder_rank`**（退出前的排名）。
            投影时**不要与 `items` 合并**成一个数组 —— 二者语义相反
            （在榜 vs 已退出），字段集也不同。
          items:
            $ref: '#/components/schemas/QuitHolderItem'
        times:
          type: array
          description: |
            全部可用报告期 —— **日期索引的来源**。

            取历史期 = 按 `times[].value` 传 `locate`/`start` 逐个展开请求
            （用 `@Expanded`，不是 `@Paginated`）。

            ⚠️ `name` **混着报告期与具体日期**（`2026中报` / `2026-08-05`），
            后者是定期报告之外的临时披露。

            ⚠️ 两种 `circula` 口径的可用期数不同（实测 48 vs 36），
            不能用一种口径的 `times` 去展开另一种。
          items:
            $ref: '#/components/schemas/TimeIndexItem'

    HolderItem:
      type: object
      properties:
        holder_name:
          type: string
          description: 股东名称（含席位/产品全称，原样透传）
          example: 厦门瑞庭投资有限公司
        held_num:
          type: number
          description: 持股数量（**股**）
          example: 1019704949
        held_ratio:
          type: number
          description: 持股占比（**百分数**，`22.04` = 22.04%）
          example: 22.04
        chg:
          type: number
          description: |
            持股**数量**的环比变动（**百分数**）。

            **已验证**（易方达创业板 ETF）：
            ```
            本期 28,619,389 / 上期 25,105,056
            (28,619,389 − 25,105,056) / 25,105,056 = +14.0%  == chg 14.0 ✅
            ```

            ⚠️ 这是**持股数量**的变动率，**不是持股占比**的变动率
            （同期占比变动为 +14.81%，与字段值不符）。
            总股本变化时两者不同向 —— 增发后股东未减持时 `chg=0`
            但 `held_ratio` 会下降。

            ⚠️ `0.0` 表示**持股未变**，不是「无数据」。
          example: 0.0

    QuitHolderItem:
      type: object
      description: |
        本期退出前十的股东。

        ⚠️ **字段集与 `items[]` 不同，不是简单的「多一个字段」**
        （已全量核实 66 条 quit 项）：

        | 字段 | `items[]` | `quit[]` |
        | --- | --- | --- |
        | `holder_name` / `held_num` / `held_ratio` | ✅ | ✅ |
        | `chg`（环比变动） | ✅ | ❌ **没有** |
        | `holder_rank`（退出前排名） | ❌ | ✅ |

        故本 schema **独立定义**，不用 `allOf` 继承 `HolderItem`
        —— 继承会凭空多出一个上游并不返回的 `chg`。
      properties:
        holder_name:
          type: string
          description: 股东名称
          example: 中国工商银行股份有限公司-华泰柏瑞沪深300交易型开放式指数证券投资基金
        held_num:
          type: number
          description: 退出前持股数量（**股**）
          example: 43712032
        held_ratio:
          type: number
          description: 退出前持股占比（**百分数**）
          example: 0.96
        holder_rank:
          type: integer
          description: |
            **退出前的排名** —— `items[]` 中没有此字段。
          example: 8

    HolderTotal:
      type: object
      description: |
        十大股东合计。**已验证与 `items[]` 之和精确吻合**：
        ```
        items 占比之和 66.28  == held_ratio 66.28           ✅
        items 持股之和 3,066,053,502 == held_num            ✅
        ```
        `held_ratio` 即**股权集中度**，是股权分析的核心指标。
      properties:
        held_num:
          type: number
          description: 十大股东合计持股数量（股）
          example: 3066053502
        held_ratio:
          type: number
          description: 十大股东合计持股比例（百分数）
          example: 66.28
        chg:
          type: number
          description: 合计持股数量的环比变动（百分数）
          example: -0.11

    TimeIndexItem:
      type: object
      description: 可用报告期索引项
      properties:
        name:
          type: string
          description: 期次显示名（`2026中报` 或 `2026-08-05`）
          example: 2026中报
        value:
          type: integer
          format: int64
          description: 期次时间戳（毫秒）—— 作为 `locate` / `timestamp` 入参
          example: 1782748800000

    # ── 股东人数 ────────────────────────────────────────────
    HoldersNumResponse:
      allOf:
        - $ref: '#/components/schemas/F10EnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/HoldersNumItem'

    HoldersNumItem:
      type: object
      description: |
        单期股东人数与筹码结构。

        **两组勾稽已验证**：
        ```
        ① per_amount = per_float × price
           16584.555446926857 × 393.01 = 6,517,896.136196724   ✅
        ② ashare_holder + hshare_holder = holder_num
           269,979 + 54 = 270,033                              ✅
        ```
      properties:
        timestamp:
          type: integer
          format: int64
          description: 报告期（毫秒）。**跨页去重的业务主键**
          example: 1782748800000
        holder_num:
          type: integer
          description: 股东总户数
          example: 270033
        ashare_holder:
          type: [integer, 'null']
          description: A 股股东户数
          example: 269979
        hshare_holder:
          type: [integer, 'null']
          description: H 股股东户数
          example: 54
        bshare_holder:
          type: [integer, 'null']
          description: B 股股东户数（无 B 股时为 `null`）
          example: null
        chg:
          type: number
          description: |
            股东户数的**环比**变动（**百分数**）。

            **已验证**（四期反算全部吻合）：
            `(270,033 − 204,504) / 204,504 = +32.04%` == `chg 32.04` ✅
          example: 32.04
        per_float:
          type: number
          description: 户均持流通股（**股**）
          example: 16584.555446926857
        per_float_chg:
          type: number
          description: 户均持股的环比变动（百分数）
          example: -23.14
        per_amount:
          type: number
          description: 户均持股**市值**（元）= `per_float × price`
          example: 6517896.136196724
        price:
          type: number
          description: |
            该报告期股价（元）。

            🔴 **不能替代行情源做估值** —— 只在股东人数披露日有值
            （一年数期），且未说明是收盘价还是均价。
          example: 393.01
        top_holder_ratio:
          type: number
          description: 前十大股东合计持股比例（百分数）
          example: 66.53
        top_float_holder_ratio:
          type: number
          description: 前十大**流通**股东合计持股比例（百分数）
          example: 63.3138

    # ── 基金持股 ────────────────────────────────────────────
    OrgHoldingResponse:
      allOf:
        - $ref: '#/components/schemas/F10EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OrgHoldingData'

    OrgHoldingData:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
          description: 当前期时间戳（毫秒）
          example: 1782748800000
        chg_date:
          type: string
          description: |
            当前期名称。⚠️ 字段名像日期，**实为报告期名称字符串**。
          example: 2026中报
        times:
          type: array
          description: |
            全部可用报告期（本样本 33 期）。
            取历史期传 `timestamp`（⚠️ 与 `top_holders` 的 `locate` 参数名不同）。
          items:
            $ref: '#/components/schemas/TimeIndexItem'
        fund_items:
          type: array
          description: |
            基金持股明细（本样本 **2160 条**）。

            🔴 **业务数据在 `fund_items` 而非 `items`** —— 与本组其它端点
            不一致，取值时容易写错键名。

            🔴 **首条是「全部合计」汇总行，不是一只基金**：
            ```
            fund_items[0].org_name_or_fund_name = "全部合计"
            fund_items[1] 起才是个体基金
            ```
            **已验证**：合计行 `held_num` 294,063,712 == 2159 条明细之和，
            差额 **0** ✅

            **实现要求**：投影时必须把首条剥离为独立的汇总字段，
            不能混在明细数组里 —— 否则「持仓基金数量」多算 1、
            「最大持仓基金」永远是那条汇总行。

            ⚠️ 已全量扫描确认本样本只有这一条汇总行，
            但**按名称匹配比按位置判断更稳妥**。
          items:
            $ref: '#/components/schemas/FundHoldingItem'

    FundHoldingItem:
      type: object
      properties:
        org_name_or_fund_name:
          type: string
          description: 机构或基金名称。⚠️ 值为 `全部合计` 时是汇总行
          example: 易方达创业板交易型开放式指数证券投资基金
        held_num:
          type: number
          description: 持股数量（**股**）
          example: 16165525
        to_float_shares_ratio:
          type: number
          description: |
            占**流通股**比例（**百分数**，`0.3795` = 0.3795%）。

            ⚠️ 分母是流通股，不是总股本、也不是该基金净值。
          example: 0.3795

    # ── 限售解禁 ────────────────────────────────────────────
    SharesChgResponse:
      allOf:
        - $ref: '#/components/schemas/F10EnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/RestrictItem'

    RestrictItem:
      type: object
      description: |
        单条限售解禁记录。

        ⚠️ **同一解禁日会有多条记录**（本样本 10 条中有 5 条
        `floatable_time` 相同，分属不同股东）—— 这是同一批解禁按股东拆分。
        算「某日解禁总量」必须**按 `floatable_time` 分组求和**，不能取单条。
      properties:
        holder_name:
          type: string
          description: 股东名称
          example: 香港上海汇丰银行有限公司
        floatable_time:
          type: integer
          format: int64
          description: 可流通日（解禁日，毫秒时间戳）
          example: 1672761600000
        floatable_shares_num:
          type: number
          description: |
            解禁数量（**股**）。
            ⚠️ 上游值带浮点噪声（`3419511.9999999995`），投影时按需取整。
          example: 3419511.9999999995
        float_shares_type:
          type: string
          description: |
            解禁股份类型。

            本样本**只出现一种**：`定向增发机构配售股份`（10/10 条）。

            A 股实际还有「首发原股东限售股份」「股权激励限售股份」
            「首发战略配售股份」等，**本样本未覆盖** ——
            按开放字符串处理，不要做枚举映射。
          example: 定向增发机构配售股份

    # ── 高管增减持 ──────────────────────────────────────────
    SkHolderChgResponse:
      allOf:
        - $ref: '#/components/schemas/F10EnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/SkHolderChgItem'

    SkHolderChgItem:
      type: object
      description: |
        单条高管（及关联人）持股变动记录。

        **余额链已验证**（按时间倒序，`本期余额 − 本期变动 == 上期余额`）：
        ```
        259,212,300 − (−333,300) = 259,545,600  == 上期  ✅
        259,545,600 − (−304,500) = 259,850,100  == 上期  ✅
        259,850,100 − (−258,400) = 260,108,500  == 上期  ✅
        260,108,500 − (−106,200) = 260,214,700  == 上期  ✅
        260,214,700 − (−281,700) = 260,496,400  == 上期  ✅
        ```
        这确认了 `chg_shares_num` 的符号约定与 `daily_shares_balance_otd`
        的「变动后」语义。

        ⚠️ **6 条中有 1 条差 100 股**（同日多笔交易被合并所致，非字段语义
        问题）—— 不要把余额链当强校验，只作参考。
      properties:
        symbol:
          type: string
          example: SZ300750
        name:
          type: string
          description: 标的名称
          example: 宁德时代
        share_changer_name:
          type: string
          description: 股份变动人（实际买卖的人）
          example: 黄世霖
        manage_name:
          type: string
          description: 关联高管。变动人若是高管亲属，此处是高管本人
          example: 黄世霖
        rr_of_chgr_and_manage:
          type: string
          description: 变动人与高管的关系。本样本全为 `本人`
          example: 本人
        duty:
          type: string
          description: 职务
          example: 董事、高管
        chg_date:
          type: integer
          format: int64
          description: 变动日期（毫秒时间戳）
          example: 1654012800000
        chg_shares_num:
          type: number
          description: |
            变动股数。🔴 **负数 = 减持，正数 = 增持**。
          example: -311500
        trans_avg_price:
          type: number
          description: 成交均价（元/股）
          example: 408.0
        daily_shares_balance_otd:
          type: number
          description: |
            **变动后**持股余额（股）。otd = of the day。
          example: 258900700

tags:
  - name: 财务数据
    description: 个股财务报表与指标（A 组 · `finance/cn/**`）
  - name: 股权与公司运作
    description: |
      股东结构、分红增发、机构持仓、解禁与高管增减持（B 组 · `f10/cn/**`）。

      填补了原先标记为 🔴 高严重度的「分红」与「股东结构」两项缺口。
      仍缺股价/市值（估值分析需另接行情源）。
