        ## 翻页范式：日期索引，不是翻页

        首次请求（不带 `locate`）返回 `data.times[]` 列出全部可用报告期；
        取历史期按 `times[].value` 传 `locate`/`start` **逐个展开请求**。

        实现用 **`@Expanded`**（source 为 `times[]`）而非 `@Paginated`
        —— 这是「入参驱动、要几期发几次」的形态（CLAUDE.md §2.5）。

        ⚠️ **`count` 不控制返回条数**：实测传 `count=200` 仍只返回 10 条，
        上游固定返回前十大。不要以为调大能拿到更多股东。

        ⚠️ 两种 `circula` 口径的可用期数不同（实测 48 vs 36），
        不能用一种口径的 `times` 去展开另一种。

