      type: apiKey
      in: cookie
      name: xq_a_token
      description: |
        雪球登录态 Cookie。**必需** —— 缺失时返回 `400016`。

        Chrome 导出的 HAR 会脱敏 `cookie` 请求头，故抓包中不可见；
        但响应头 `access-control-allow-credentials: true` 与
        `access-control-allow-origin: https://xueqiu.com`（回显具体 Origin 而非 `*`）
        共同证明这是带凭据的跨域请求。

        具体 Cookie 名称未从抓包直接确认（`xq_a_token` 为雪球站点惯例），
        实现上无需关心——应在已登录的浏览器页面上下文内发请求，由浏览器自动附带，
        **不得把 Cookie 提取到 Node 层**。

  parameters:
    SymbolParam:
      name: symbol
      in: query
      required: true
      description: |
        标的代码，格式为 `{交易所前缀}{6位数字}`。
        已验证前缀：`SH`（上交所，A 组样本 SH601127）、`SZ`（深交所，B 组样本 SZ300750）。
        `BJ` 按站点惯例推定，未在抓包中验证。

        实现建议只做形状校验（防注入），不做代码白名单——上游标的集合是开放的。
      schema:
        type: string
        pattern: '^[A-Z]{2}\d{6}$'
        example: SH601127
    TypeParam:
      name: type
      in: query
      required: true
      description: |
        报告期筛选。**这是上游定义的枚举，实现时只做形状校验、不做白名单拦截**
        （可能存在下表未列出的取值）。

        ### 定期报告口径（`report_name` 措辞为「…季**报**」）

        | 取值 | 语义 | 实测返回 |
        | --- | --- | --- |
        | `all` | 全部期次倒序 | 2026Q1 / 2025年报 / 2025Q3 / 2025中报 / 2025Q1 |
        | `Q1` | 仅一季报 | 2026Q1 / 2025Q1 / 2024Q1 / … |
        | `Q2` | **仅中报**（非"第二季度"） | 2025中报 / 2024中报 / … |
        | `Q3` | 仅三季报 | 2025三季报 / 2024三季报 / … |
        | `Q4` | **仅年报**（非"第四季度"） | 2025年报 / 2024年报 / … |

        ⚠️ `Q2` / `Q4` 命名有误导性：指的是累计到该季末的定期报告（中报/年报），
        不是单季数据。

        ### 单季口径（`report_name` 措辞为「…季**度**」）

        | 取值 | 语义 |
        | --- | --- |
        | `S0` | 全部期次的**单季**值，倒序 |
        | `S1` – `S4` | 仅第 N 季度的**单季**值 |

        `S` 系列 = 相邻期累计值的**机械差分**（已验算：S0「2025四季度」总资产
        224.00 亿 = 2025年报 1439.06 亿 − 2025三季报 1215.06 亿，精确吻合）。
        `S1` 因无需差分，数值与 `Q1` 完全相同，仅措辞不同。

        🔴 **`S` 系列只对期间流量表（利润表、现金流量表）有意义**。
        用在资产负债表这类**时点存量表**上会产出荒谬数据 —— 详见
        `getCnBalanceSheet` 的说明。

        > ⚠️ **`S` 系列仅在资产负债表 HAR 中出现**。`income.json` 是否支持尚未实测
        > （两端点入参一致，很可能支持）。这正是"抓包样本 ≠ 全集"的实例，
        > **再次强调不要对本参数做白名单拦截**。
      schema:
        type: string
        example: all
    IsDetailParam:
      name: is_detail
      in: query
      required: true
      description: |
        是否返回明细科目。抓包中恒为 `true`。
        取 `false` 时是否精简字段集**未验证**。
      schema:
        type: boolean
        default: true
        example: true
    CountParam:
      name: count
      in: query
      required: true
      description: |
        单次返回的报告期数。抓包中恒为 `5`，**上限未验证**。

        同时是分页终止判据：返回的 `data.list` 长度 < `count` 即表示已到最早一期。
      schema:
        type: integer
        minimum: 1
        example: 5
    TimestampParam:
      name: timestamp
      in: query
      required: false
      description: |
        **翻页游标（毫秒时间戳），不是防缓存参数**。

        语义为「返回 `report_date <= timestamp` 的记录」。

        **首页**：传当前毫秒时间戳，或**传空串**——两者返回完全一致（抓包已验证，
        `timestamp=1786022292643` 与 `timestamp=` 的响应体大小同为 11493 字节）。

        **续取**：传「上一页最后一条的 `report_date` + 1」。
        `+1` 是必要的——比较为闭区间，直接传 `report_date` 会重复返回该条。

        实测游标链（`type=all`, `count=5`）：

        | 请求 timestamp | 返回期次 | 末条 report_date |
        | --- | --- | --- |
        | 1786022292643（当前时间） | 2026Q1…2025Q1 | 1743350400000 |
        | 1743350400001 | 2025Q1…2024Q1 | 1711814400000 |
        | 1711814400001 | 2024Q1…2023Q1 | 1680192000000 |
        | 1680192000001 | 2023Q1…2022Q1 | 1648656000000 |

        ⚠️ 上游**不返回** `has_more` / `total`，终止只能靠 `list.length < count`。
      schema:
        oneOf:
          - type: integer
            format: int64
          - type: string
            enum: ['']
        example: 1743350400001

    # ── B 组 · f10 端点专用参数 ──────────────────────────────
    PageParam:
      name: page
      in: query
      required: true
      description: |
        页码，从 1 开始。

        ⚠️ 终止判据见 `SizeParam` —— **不能用 `length < size`**。
      schema:
        type: integer
        minimum: 1
        example: 1
    SizeParam:
      name: size
      in: query
      required: true
      description: |
        每页条数，抓包中恒为 `10`。

        🔴 **每页实际条数逐端点而异，终止判据不能一刀切**（已逐一实测）：

        | 端点 | size=10 时每页返回 | 到底判据 |
        | --- | --- | --- |
        | `holders` | **11 条**（多返一条作下页预览） | `length <= size` |
        | `bonus` / `shareschg` / `skholderchg` | 10 条（标准） | `length < size` |

        两个方向都会出错且**都不报错**：
        - 对 `holders` 用 `length < size` → 永远不成立（11 > 10），一直翻到上游返空；
        - 对其余端点用 `length <= size` → **第一页就误判到底**（10 <= 10），数据全丢。

        后者是实现时踩过的真实坑（`bonus` 只拿到 10 条而真实有 12 条）。

        另：`holders` 的边界会重复一条，跨页合并须按业务主键去重
        （`holders` 用 `timestamp`，其余端点见各自 schema）。
      schema:
        type: integer
        minimum: 1
        example: 10
    ExtendParam:
      name: extend
      in: query
      required: false
      description: 抓包中恒为 `true`，语义未验证（取 `false` 时的差异未知）
      schema:
        type: boolean
        example: true
    CirculaParam:
      name: circula
      in: query
      required: true
      description: |
        **股东口径开关** —— 这是「十大股东」与「十大流通股东」
        命中同一端点的原因。

        | 取值 | 口径 |
        | --- | --- |
        | `0` | 十大股东（全体股东） |
        | `1` | 十大**流通**股东 |

        ⚠️ 两种口径的可用报告期数不同（实测 `circula=0` 有 48 期、
        `circula=1` 有 36 期），不能用一种口径的 `times[]` 去展开另一种。
      schema:
        type: integer
        enum: [0, 1]
        example: 0
    LocateParam:
      name: locate
      in: query
      required: false
      description: |
        报告期时间戳（毫秒）。不传则返回最新期。

        取值**必须来自同一 `circula` 口径下首次请求返回的 `times[].value`**，
        不要自行构造时间戳。

        ⚠️ 这不是翻页游标，而是**日期索引** —— 取多期是按 `times[]`
        逐个展开请求（`@Expanded`），不是顺序翻页（`@Paginated`）。
      schema:
        type: integer
        format: int64
        example: 1782748800000
    StartParam:
      name: start
      in: query
      required: false
      description: |
        抓包中**恒与 `locate` 同值**，独立语义未验证。
        实现时跟随 `locate` 一起传同一个值。
      schema:
        type: integer
        format: int64
        example: 1782748800000
    OrgTimestampParam:
      name: timestamp
      in: query
      required: false
      description: |
        报告期时间戳（毫秒），取值来自 `times[].value`。不传则返回最新期。

        ⚠️ 与 `top_holders.json` 的同语义参数**名称不同**（那里叫 `locate`），
        两者不可互换。同样是日期索引而非翻页游标。
      schema:
        type: integer
        format: int64
        example: 1782748800000
    SharesChgTypeParam:
      name: type
      in: query
      required: true
      description: |
        股本变动类型。抓包中恒为 `restricts`（限售解禁）。

        ⚠️ 端点名是 `shareschg`（股本变动）而非 `restricts`，**强烈暗示
        还有其它取值**（如股本变动、回购），但本次抓包未覆盖。

        这是**上游定义的枚举**，按 CLAUDE.md §3.6 只做形状校验、
        不做白名单拦截。
      schema:
        type: string
        example: restricts


  schemas:
    FinanceEnvelopeBase:
      type: object
      description: |
        `stock.xueqiu.com/v5/stock/finance/cn/**` **全族共用**的响应信封外层。
        各端点通过 `allOf` 组合本 schema 并收窄 `data.list` 的元素类型。
      required: [data, error_code]
      properties:
        error_code:
          description: |
            ⚠️ **类型会漂移**：成功时为 number `0`，失败时为 string（如 `"400016"`）。
            判定须归一化：`Number(error_code) === 0`。
          oneOf:
            - type: integer
            - type: string
          examples: [0, '400016']
        error_description:
          type: string
          description: 错误描述，成功时为空串
          example: ''

    FinanceDataBase:
      type: object
      description: |
        `data` 的**共用外层字段**（两端点已验证完全一致的 6 个元数据字段）。
        各端点用 `allOf` 组合本 schema 并追加自己的 `list`。

        ⚠️ 鉴权失败时本对象**只有 `list: []`**，其余字段全部缺失。
      properties:
        quote_name:
          type: [string, 'null']
          description: 标的名称
          example: 赛力斯
        currency:
          type: [string, 'null']
          description: 币种代码。决定 `list[]` 中金额字段的货币单位
          example: CNY
        currency_name:
          type: [string, 'null']
          description: 币种中文名
          example: 人民币
        org_type:
          type: [integer, 'null']
          description: |
            机构类型。本次样本仅见 `1`（一般工商企业）。

            ⚠️ 银行/保险/券商的报表科目与工商企业**完全不同**
            （如银行有"利息净收入"而无"营业成本"；资产负债表差异更大——
            银行有"吸收存款""发放贷款"等专属科目）。
            其他 `org_type` 对应的字段集**未验证**，实现时不可假设字段集恒定。
          example: 1
        last_report_name:
          type: [string, 'null']
          description: 最新一期报告名称
          example: 2026一季报
        statuses:
          description: 两端点抓包全程均为 `null`，语义未知
          type: ['null', object, array]

    IncomeResponse:
      allOf:
        - $ref: '#/components/schemas/FinanceEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/IncomeData'

    IncomeData:
      allOf:
        - $ref: '#/components/schemas/FinanceDataBase'
        - type: object
          properties:
            list:
              type: array
              description: 报告期数组，按 `report_date` **倒序**
              items:
                $ref: '#/components/schemas/IncomePeriod'

    BalanceResponse:
      allOf:
        - $ref: '#/components/schemas/FinanceEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/BalanceData'

    BalanceData:
      allOf:
        - $ref: '#/components/schemas/FinanceDataBase'
        - type: object
          properties:
            list:
              type: array
              description: 报告期数组，按 `report_date` **倒序**
              items:
                $ref: '#/components/schemas/BalancePeriod'

    CashFlowResponse:
      allOf:
        - $ref: '#/components/schemas/FinanceEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CashFlowData'

    CashFlowData:
      allOf:
        - $ref: '#/components/schemas/FinanceDataBase'
        - type: object
          properties:
            list:
              type: array
              description: 报告期数组，按 `report_date` **倒序**
              items:
                $ref: '#/components/schemas/CashFlowPeriod'

    IndicatorResponse:
      allOf:
        - $ref: '#/components/schemas/FinanceEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/IndicatorData'

    IndicatorData:
      allOf:
        - $ref: '#/components/schemas/FinanceDataBase'
        - type: object
          properties:
            list:
              type: array
              description: 报告期数组，按 `report_date` **倒序**
              items:
                $ref: '#/components/schemas/IndicatorPeriod'

    ValueWithYoY:
      type: array
      description: |
        **`[本期值, 同比增长率]` 二元组**，长度恒为 2（已用 jq 校验全部 40 个字段）。

        | 位置 | 含义 | 单位 |
        | --- | --- | --- |
        | `[0]` | 本期值（累计口径） | 元；`*_eps` 字段为**元/股** |
        | `[1]` | 同比增长率 | **小数**，`0.3446` 表示 +34.46% |

        ⚠️ `[1]` 是小数比率而非百分数，回写给用户前需 ×100。
        投影层应原样透传并在 `meta.semantics` / `units` 中声明口径，不做二次换算。

        ⚠️ `[null, null]` 表示**该科目本期不适用或未披露**，
        必须映射为 `null`，**不得填 0**。

        验证：赛力斯 2026Q1 营收 257.46 亿 vs 2025Q1 营收 191.47 亿，
        `(257.46-191.47)/191.47 = 0.3446` 与 `[1]` 完全吻合。
      minItems: 2
      maxItems: 2
      items:
        type: [number, 'null']
      example: [25745711786.75, 0.3446285931858831]

    IncomePeriod:
      type: object
      description: |
        单个报告期的利润表数据。

        除 `report_date` / `report_name` / `ctime` 三个标量外，
        **其余 40 个字段全部是 `ValueWithYoY` 二元组**。

        字段中文名的说明：表头映射表不在本次抓包的前端资源中，
        以下中文名依据勾稽关系验算与会计准则推定。
        标注「勾稽验证」的项已用赛力斯 2026Q1 实数验算通过（见 README §4.4）。
      properties:
        # ── 标量字段 ──────────────────────────────────────────
        report_date:
          type: integer
          format: int64
          description: |
            报告期末日期，**毫秒**时间戳，恒为该期最后一日 00:00:00 **东八区**
            （`1774886400000` → 2026-03-31 00:00:00 CST）。

            同时是翻页游标的来源：下一页传 `report_date + 1`。
          example: 1774886400000
        report_name:
          type: string
          description: 报告期名称
          example: 2026一季报
        ctime:
          type: integer
          format: int64
          description: 该条数据入库时间（毫秒），约等于公告披露后的落库时刻
          example: 1777463147000

        # ── 营业总收入 / 成本 ─────────────────────────────────
        total_revenue:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 营业总收入（勾稽验证）。本样本与 `revenue` 完全相等
        revenue:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            营业收入（勾稽验证）。工商企业中与 `total_revenue` 相等，
            但金融企业会分离，**不可假设恒等**
        operating_costs:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            营业**总**成本（勾稽验证）。
            ⚠️ 与 `operating_cost` 只差一个 `s`，极易混淆
        operating_cost:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            营业成本（勾稽验证）。
            ⚠️ 与 `operating_costs` 只差一个 `s`，极易混淆
        operating_taxes_and_surcharge:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 税金及附加（勾稽验证）
        sales_fee:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 销售费用（勾稽验证）
        manage_fee:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 管理费用（勾稽验证）
        rad_cost:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 研发费用（勾稽验证）。rad = R&D
        financing_expenses:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 财务费用（勾稽验证）
        finance_cost_interest_fee:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 财务费用—利息费用（推定）
        finance_cost_interest_income:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 财务费用—利息收入（推定）

        # ── 营业利润构成 ──────────────────────────────────────
        other_income:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 其他收益（勾稽验证）
        invest_income:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 投资收益（勾稽验证）
        invest_incomes_from_rr:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 对联营/合营企业的投资收益（推定）。rr = related relation
        income_from_chg_in_fv:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 公允价值变动收益（勾稽验证）。fv = fair value
        credit_impairment_loss:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            信用减值损失（勾稽验证）。

            ⚠️ **本字段为负值**（本样本 -352 万），而 `asset_impairment_loss` 为正值
            —— 上游两者符号约定相反。计算营业利润时前者直接相加、后者须减去。
            **投影层不要"顺手统一符号"**，那会静默改变数据含义。
        asset_impairment_loss:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            资产减值损失（勾稽验证）。本样本为**正值**，
            勾稽营业利润时须**减去**。符号约定与 `credit_impairment_loss` 相反
        asset_disposal_income:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 资产处置收益（勾稽验证）
        exchg_gain:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 汇兑收益（推定）。本样本全部为 `[null, null]`
        op:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            **营业利润**（勾稽验证）。op = operating profit。

            勾稽：`total_revenue - operating_costs + other_income + invest_income
            + income_from_chg_in_fv + credit_impairment_loss - asset_impairment_loss
            + asset_disposal_income` ≈ `op`（本样本差 0.9%，为未单列科目）

        # ── 利润总额 / 净利润 ─────────────────────────────────
        non_operating_income:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 营业外收入（勾稽验证）
        non_operating_payout:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 营业外支出（勾稽验证）
        noncurrent_assets_dispose_gain:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 非流动资产处置利得（推定）
        noncurrent_asset_disposal_loss:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 非流动资产处置损失（推定）
        profit_total_amt:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            **利润总额**（勾稽验证，完全吻合）。

            勾稽：`op + non_operating_income - non_operating_payout == profit_total_amt`
        income_tax_expenses:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 所得税费用（勾稽验证）
        net_profit:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            **净利润**（勾稽验证，完全吻合），**含少数股东损益**。

            勾稽：`profit_total_amt - income_tax_expenses == net_profit`

            ⚠️ 与 `net_profit_atsopc`（归母净利润）是**不同概念**，回写时不可混用
        continous_operating_np:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            持续经营净利润（勾稽验证）。本样本 == `net_profit`
            （因 `net_profit_bi` 全为 null，即无终止经营业务）
        net_profit_bi:
          $ref: '#/components/schemas/ValueWithYoY'
          description: 终止经营净利润（推定）。本样本全为 `[null, null]`
        net_profit_atsopc:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            **归属于母公司股东的净利润**（勾稽验证，完全吻合）。
            atsopc = attributable to shareholders of parent company。

            勾稽：`net_profit_atsopc + minority_gal == net_profit`

            ⚠️ 本样本中 `minority_gal` 为负，导致**归母净利润（7.54 亿）高于
            合并净利润（6.11 亿）**。回写时必须明确区分二者，否则数字张冠李戴
        minority_gal:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            少数股东损益（勾稽验证）。gal = gain and loss。
            **可为负**（本样本 -1.44 亿，即少数股东承担亏损）
        net_profit_after_nrgal_atsolc:
          $ref: '#/components/schemas/ValueWithYoY'
          description: |
            归属于母公司股东的**扣非**净利润（勾稽验证）。
            nrgal = non-recurring gain and loss（非经常性损益）

