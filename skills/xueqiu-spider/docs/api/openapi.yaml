  /v5/stock/f10/cn/holders.json:
    get:
      operationId: getCnHoldersNum
      summary: 获取股东人数与筹码结构
      description: |
        筹码集中度分析的核心数据源。

        🔴 **本端点是四个 page/size 端点中唯一多返一条的**：`size=10` 实测
        每页返回 **11 条**，末条是下一页的第一条（page=1 末条与 page=2 首条的
        `timestamp` 完全相同）。

        故本端点终止判据用 `length <= size`（其余三个用 `length < size`），
        跨页合并按 `timestamp` 去重。**不要把此行为外推到其它端点** ——
        详见 `SizeParam`。

        ## 分析价值

        | 信号 | 含义 |
        | --- | --- |
        | `holder_num` ↑ + `per_float` ↓ | 筹码分散（散户增多） |
        | `holder_num` ↓ + `per_float` ↑ | 筹码集中（通常视为积极信号） |
        | `top_holder_ratio` 持续 ↓ | 大股东减持或股权稀释 |

        本样本 2026 中报：户数 +32.04%、户均持股 −23.14% —— 典型筹码分散。
